# Small crews fixture mirroring the Auto-Orch schema (not a copy of the live file).
version: 1

workers:
  codex_sol_high:
    command: "/usr/bin/env CODEX_STAGE_WORKER_BINARY=/x/bin/codex CODEX_STAGE_WORKER_MODEL=gpt-5.6-sol CODEX_STAGE_WORKER_REASONING_EFFORT=high python3 /x/codex_stage_worker.py {stage} {prompt_path} {response_path}"
    preflight_command: "/usr/bin/env CODEX_STAGE_WORKER_BINARY=/x/bin/codex CODEX_STAGE_WORKER_MODEL=gpt-5.6-sol CODEX_STAGE_WORKER_REASONING_EFFORT=high python3 /x/codex_stage_worker.py --preflight"
    timeout_seconds: 900
  codex_luna_max:
    command: "/usr/bin/env CODEX_STAGE_WORKER_BINARY=/x/bin/codex CODEX_STAGE_WORKER_MODEL=gpt-5.6-luna CODEX_STAGE_WORKER_REASONING_EFFORT=max python3 /x/codex_stage_worker.py {stage} {prompt_path} {response_path}"
    preflight_command: "/usr/bin/env CODEX_STAGE_WORKER_BINARY=/x/bin/codex CODEX_STAGE_WORKER_MODEL=gpt-5.6-luna CODEX_STAGE_WORKER_REASONING_EFFORT=max python3 /x/codex_stage_worker.py --preflight"
    timeout_seconds: 600
  claude_opus5_high:
    command: "/usr/bin/env CLAUDE_STAGE_WORKER_BINARY=/x/bin/claude CLAUDE_STAGE_WORKER_MODEL=claude-opus-5 CLAUDE_STAGE_WORKER_EFFORT=high python3 /x/claude_stage_worker.py {stage} {prompt_path} {response_path}"
    preflight_command: "/usr/bin/env CLAUDE_STAGE_WORKER_BINARY=/x/bin/claude CLAUDE_STAGE_WORKER_MODEL=claude-opus-5 CLAUDE_STAGE_WORKER_EFFORT=high python3 /x/claude_stage_worker.py --preflight"
    timeout_seconds: 600
  antigravity_gemini38_flash_high:
    command: "/usr/bin/env ANTIGRAVITY_STAGE_WORKER_BINARY=/x/bin/agy ANTIGRAVITY_STAGE_WORKER_MODEL=gemini-3.8-flash-high ANTIGRAVITY_STAGE_WORKER_EFFORT=high python3 /x/antigravity_stage_worker.py {stage} {prompt_path} {response_path}"
    preflight_command: "/usr/bin/env ANTIGRAVITY_STAGE_WORKER_BINARY=/x/bin/agy ANTIGRAVITY_STAGE_WORKER_MODEL=gemini-3.8-flash-high ANTIGRAVITY_STAGE_WORKER_EFFORT=high python3 /x/antigravity_stage_worker.py --preflight"
    timeout_seconds: 600

crews:
  test-flagship:
    description: >-
      Fixture crew with single-worker stages only.
    stages:
      envision: codex_sol_high
      ideate: claude_opus5_high
      reconsider: codex_luna_max
      score: codex_luna_max
      author: codex_sol_high
    governed:
      primary: {harness: claude_code, model: claude-opus-5}
      reviewer: {harness: codex_cli, model: gpt-5.6-sol}
      judge: {harness: codex_cli}
  test-flex:
    description: >-
      Fixture crew whose envision stage declares an ordered eligible set.
    stages:
      envision: [codex_luna_max, antigravity_gemini38_flash_high, codex_sol_high]
      ideate: claude_opus5_high
      reconsider: codex_luna_max
      score: antigravity_gemini38_flash_high
      author: codex_sol_high
    governed:
      primary: {harness: antigravity_cli, model: gemini-3.8-flash-high}
      reviewer: {harness: codex_cli, model: gpt-5.6-sol, effort: low}
      judge: {harness: claude_code, model: claude-sonnet-5}
    judge_model: claude-sonnet-5
